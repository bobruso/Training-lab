name: Training Lab auth banner v8.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auth-banner-v84.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply auth banner fix
        run: python3 tools/patch_auth_banner_v84.py
      - name: Validate
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime.js service-worker.js
          git commit -m "Suppress stale access error after authenticated session"
          git push origin main
