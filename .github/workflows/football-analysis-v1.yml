name: Temporary football analysis v1
on:
  push:
    branches: [feature/football-analysis-v1]
    paths: [.github/workflows/football-analysis-v1.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/football-analysis-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch analyze-fit
        run: python tools/patch_football_analysis_v1.py
      - run: npm ci
      - run: node --check supabase/functions/analyze-fit/analysis/football.js
      - run: node --test tests/*.test.mjs
      - run: npm run check
      - run: deno check --config supabase/functions/analyze-fit/deno.json supabase/functions/analyze-fit/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: git diff --check
      - name: Commit implementation
        run: |
          rm .github/workflows/football-analysis-v1.yml tools/patch_football_analysis_v1.py
          git config user.name bobruso
          git config user.email 51798343+bobruso@users.noreply.github.com
          git add -A
          git commit -m "Add deep football FIT analysis"
          git push origin feature/football-analysis-v1
# retry after strict TypeScript narrowing fix
