name: Training Lab Android FIT picker v2

on:
  push:
    paths:
      - '.github/workflows/android-fit-picker-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Apply patch
        run: python3 tools/patch_android_fit_picker_v2.py
      - name: Build and lint Android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: android-companion
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-companion/app/src/main/java/com/traininglab/companion/MainActivity.kt android-companion/app/build.gradle.kts
          git commit -m "Fix Android FIT document picker" || exit 0
          git push origin HEAD:main
