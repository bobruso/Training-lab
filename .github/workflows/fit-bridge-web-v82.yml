name: Shared FIT web fallback v8.2

on:
  push:
    paths:
      - '.github/workflows/fit-bridge-web-v82.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply web fallback
        run: python3 tools/patch_fit_bridge_web_v82.py
      - name: Validate web
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git commit -m "Silence legacy shared FIT bridge startup error" || exit 0
          git push origin HEAD:main
