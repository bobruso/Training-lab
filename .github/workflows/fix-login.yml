name: Fix Training Lab login

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button class="btn" id="loginBtn">Enviar enlace</button>', '<button class="btn" id="loginBtn" onclick="sendTrainingLabMagicLink()">Enviar enlace</button>', 1)
          if 'window.sendTrainingLabMagicLink' not in s:
              fallback = '''<script>
          window.sendTrainingLabMagicLink = async function () {
            const emailEl = document.getElementById('authEmail');
            const btn = document.getElementById('loginBtn');
            const detail = document.getElementById('cloudDetail');
            const email = (emailEl?.value || '').trim();
            if (!email) { alert('Escribe tu email.'); return; }
            const SUPABASE_URL = 'https://nnpvklaxhomarxszlclt.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_4zzi_K9QK12-qtD4RG2Gxg_TyXX1TBd';
            const redirect = location.origin + location.pathname;
            const old = btn?.textContent;
            try {
              if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
              if (detail) detail.textContent = 'Solicitando enlace de acceso…';
              const res = await fetch(`${SUPABASE_URL}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, create_user: true })
              });
              const body = await res.text();
              if (!res.ok) {
                let msg = body;
                try { const j = JSON.parse(body); msg = j.msg || j.message || j.error_description || body; } catch (_) {}
                throw new Error(msg || `HTTP ${res.status}`);
              }
              if (detail) detail.textContent = `Enlace enviado a ${email}. Revisa también spam/promociones.`;
              alert('Te he enviado el enlace de acceso. Revisa tu correo.');
            } catch (err) {
              console.error('Training Lab login fallback:', err);
              if (detail) detail.textContent = 'Error al enviar el enlace: ' + (err?.message || err);
              alert('No se pudo enviar el enlace: ' + (err?.message || err));
            } finally {
              if (btn) { btn.disabled = false; btn.textContent = old || 'Enviar enlace'; }
            }
          };
          </script>'''
              s = s.replace('<script type="module" src="./app.js"></script>', fallback + '\n<script type="module" src="./app.js?v=6.1"></script>', 1)
          else:
              s = s.replace('<script type="module" src="./app.js"></script>', '<script type="module" src="./app.js?v=6.1"></script>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "training-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix magic-link login fallback"
          git push
