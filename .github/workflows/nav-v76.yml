name: Training Lab Navigation v7.6

on:
  push:
    paths:
      - '.github/workflows/nav-v76.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_nav_v76.py
      - name: Validate
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime.js app.js styles.css service-worker.js
          git commit -m "Wrap desktop navigation without scrollbars" || exit 0
          git push origin HEAD:main
