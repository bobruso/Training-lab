name: Patch sleep dashboard v6.3
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Fix temporary sleep patch workflow' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply sleep patch
        run: python3 .github/patch_sleep_v63.py
      - name: Validate
        run: |
          npm ci
          npm run check
          node --test tests/*.test.mjs
          node --check app.js
      - name: Commit production changes
        run: |
          git config user.name "bobruso"
          git config user.email "51798343+bobruso@users.noreply.github.com"
          git rm .github/workflows/patch-sleep-v63.yml .github/patch_sleep_v63.py
          git add index.html styles.css app.js service-worker.js
          git commit -m "Upgrade sleep dashboard and auto Health Connect sync"
          git push
