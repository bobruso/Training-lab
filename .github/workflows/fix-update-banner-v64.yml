name: Fix update banner v6.4

on:
  push:
    paths:
      - '.github/workflows/fix-update-banner-v64.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix version comparison and bust cache
        run: |
          python3 <<'PY'
          from pathlib import Path

          old_build='20260909sleep63'
          new_build='20260909banner64'

          p=Path('runtime.js')
          s=p.read_text(encoding='utf-8')
          old="navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='VERSION'){state.cache=e.data.cache;document.getElementById('updateNotice').hidden=state.frontend.endsWith(String(e.data.cache).replace('training-lab-',''));render();}});"
          new="navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='VERSION'){state.cache=e.data.cache;const cacheVersion=String(e.data.cache||'').replace(/^training-lab-/,'');const runtimeSrc=document.querySelector('script[src*=\"runtime.js\"]')?.src;const runtimeVersion=runtimeSrc?new URL(runtimeSrc,location.href).searchParams.get('v'):null;const notice=document.getElementById('updateNotice');if(notice)notice.hidden=!!runtimeVersion&&runtimeVersion===cacheVersion;render();}});"
          if old not in s:
              raise SystemExit('Version handler not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          for name in ['index.html','app.js','service-worker.js']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old_build in s:
                  s=s.replace(old_build,new_build)
              p.write_text(s,encoding='utf-8')

          # Human-readable build label.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v6.3 · build sleep63','v6.4 · build banner64')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JS
        run: node --check runtime.js && node --check app.js
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime.js index.html app.js service-worker.js
          git commit -m "Fix persistent update banner" || exit 0
          git push origin HEAD:main
