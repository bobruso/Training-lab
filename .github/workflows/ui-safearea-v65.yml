name: UI safe area v6.5

on:
  push:
    paths:
      - '.github/workflows/ui-safearea-v65.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile safe area and version badge
        run: |
          python3 <<'PY'
          from pathlib import Path

          old='20260909banner64'
          new='20260909ui65'

          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          marker='/* ui-safearea-v65 */'
          css=r'''

/* ui-safearea-v65 */
.top{position:relative}
.brand::after{
  content:"v6.5 · ui65";
  display:inline-block;
  margin-left:9px;
  vertical-align:middle;
  font-size:9px;
  line-height:1;
  letter-spacing:.04em;
  font-weight:800;
  color:var(--muted);
  opacity:.82;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 6px;
}
@media(max-width:700px){
  .app{
    padding-top:max(42px, calc(env(safe-area-inset-top) + 14px));
  }
  .top{min-height:34px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .brand::after{margin-left:0;font-size:8px;padding:3px 5px}
}
'''
          if marker not in s:
              s += css
          p.write_text(s,encoding='utf-8')

          for name in ['index.html','app.js','service-worker.js']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v6.4 · build banner64','v6.5 · build ui65')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: node --check runtime.js && node --check app.js && npm run check
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html app.js service-worker.js
          git commit -m "Fix Android safe area and show app version" || exit 0
          git push origin HEAD:main
