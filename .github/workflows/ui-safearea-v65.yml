name: Training Lab UI v6.5

on:
  push:
    paths:
      - .github/workflows/ui-safearea-v65.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_ui_v65.py
      - name: Validate
        run: |
          node --check runtime.js
          node --check app.js
          npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html app.js service-worker.js
          git commit -m "Fix Android safe area and show app version" || exit 0
          git push origin HEAD:main
