name: Training Lab icon and updater v8.3

on:
  push:
    branches:
      - fix/icon-update-v07
    paths:
      - '.github/workflows/icon-update-v83.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply icon and updater fix
        run: python3 tools/patch_icon_update_v83.py
      - name: Validate JavaScript and domain tests
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime.js service-worker.js android-companion/app/build.gradle.kts android-companion/app/src/main/AndroidManifest.xml android-companion/app/src/main/res/drawable/ic_launcher_background.xml android-companion/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android-companion/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          git commit -m "Fix launcher icon and remove looping update popup"
          git push origin HEAD:fix/icon-update-v07
