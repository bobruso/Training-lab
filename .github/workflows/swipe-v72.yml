name: Training Lab Swipe v7.2

on:
  push:
    paths:
      - '.github/workflows/swipe-v72.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_swipe_v72.py
      - name: Validate
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime.js styles.css service-worker.js
          git commit -m "Add mobile swipe navigation and hide header version" || exit 0
          git push origin HEAD:main
