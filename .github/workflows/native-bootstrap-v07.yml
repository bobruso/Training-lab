name: Training Lab native bootstrap v0.7

on:
  push:
    branches:
      - fix/icon-update-v07
    paths:
      - '.github/workflows/native-bootstrap-v07.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native bootstrap
        run: python3 tools/patch_native_bootstrap_v07.py
      - name: Commit bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-companion/app/src/main/java/com/traininglab/companion/MainActivity.kt
          git commit -m "Bootstrap v0.7 out of stale web cache"
          git push origin HEAD:fix/icon-update-v07
