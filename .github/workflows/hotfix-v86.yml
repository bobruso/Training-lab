name: Temporary v8.6 marker hotfix
on:
  push:
    branches: [hotfix/v86-marker]
    paths: [.github/workflows/hotfix-v86.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v86-marker
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch build marker and cache-busting URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('favicon.png?v=20260911routes85', 'favicon.png?v=20260911insights86'),
                  ('v8.5 · build routes85', 'v8.6 · build insights86'),
                  ('styles.css?v=20260911routes85', 'styles.css?v=20260911insights86'),
                  ('app.js?v=20260911routes85', 'app.js?v=20260911insights86'),
              ],
              'app.js': [
                  ("./route-map.js?v=20260911routes85", "./route-map.js?v=20260911insights86"),
              ],
              'service-worker.js': [
                  ("training-lab-20260911insights86'", "training-lab-20260911insights86fix'"),
                  ("./app.js?v=20260911routes85", "./app.js?v=20260911insights86"),
                  ("./route-map.js?v=20260911routes85", "./route-map.js?v=20260911insights86"),
                  ("./styles.css?v=20260911routes85", "./styles.css?v=20260911insights86"),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'{name}: expected token not found: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run check
      - run: node --test tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: git diff --check
      - name: Commit hotfix
        run: |
          git config user.name bobruso
          git config user.email 51798343+bobruso@users.noreply.github.com
          git add index.html app.js service-worker.js
          git commit -m "Fix v8.6 build marker and cache busting"
          git push origin hotfix/v86-marker
