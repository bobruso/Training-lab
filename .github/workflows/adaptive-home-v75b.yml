name: Training Lab Adaptive Home v7.5b

on:
  push:
    paths:
      - '.github/workflows/adaptive-home-v75b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/run_adaptive_home_v75.py
      - name: Validate
        run: npm ci && npm run check && node --test tests/*.test.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime.js app.js styles.css service-worker.js
          git commit -m "Make Home adapt to completed activities" || exit 0
          git push origin HEAD:main
